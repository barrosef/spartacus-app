name: CI/CD — App Mobile

on:
  push:
    branches: [main]
  pull_request:
    branches: [dev, main]

jobs:
  # ─── Lint & Typecheck ───────────────────────────────────────────────────────
  test:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

  # ─── Build Android → Expo EAS ───────────────────────────────────────────────
  build-mobile:
    name: Build Android → EAS
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Auto-increment versionCode
        run: |
          CURRENT=$(grep -o '"versionCode": *[0-9]*' app.json | grep -o '[0-9]*')
          NEW=$((CURRENT + 1))
          sed -i "s/\"versionCode\": *$CURRENT/\"versionCode\": $NEW/" app.json
          echo "versionCode: $CURRENT → $NEW"
          echo "VERSION_CODE=$NEW" >> "$GITHUB_ENV"

      - name: Commit versionCode bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app.json
          git commit -m "chore: bump versionCode to ${{ env.VERSION_CODE }} [skip ci]"
          git push

      - name: Setup Expo e EAS CLI
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build Android (EAS)
        run: eas build --platform android --profile production --non-interactive

      # eas.json submit.production.android.serviceAccountKeyPath points at this
      # file; it is gitignored, so materialize it from the secret before submit.
      - name: Write Google Play service account key
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_KEY }}
        run: printf '%s' "$GOOGLE_PLAY_SERVICE_ACCOUNT_KEY" > google-sa-key.json

      - name: Submit to Play Store (internal track)
        run: eas submit --platform android --profile production --latest --non-interactive

  # ─── Build Web PWA → Firebase Hosting ──────────────────────────────────────
  deploy-web:
    name: Deploy PWA → Firebase Hosting
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Build PWA (Expo Web)
        run: npx expo export --platform web
        env:
          EXPO_PUBLIC_API_URL: ${{ secrets.API_URL }}
          EXPO_PUBLIC_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          EXPO_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          EXPO_PUBLIC_FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          EXPO_PUBLIC_EAS_PROJECT_ID: ${{ secrets.EAS_PROJECT_ID }}

      - name: Authenticate to GCP via WIF
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Deploy to Firebase Hosting
        run: |
          npm install -g firebase-tools
          firebase deploy --only hosting:app \
            --project ${{ secrets.FIREBASE_PROJECT_ID }} \
            --non-interactive
