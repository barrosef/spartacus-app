name: CI/CD — App Mobile

on:
  push:
    branches: [main]
  pull_request:
    branches: [dev, main]

jobs:
  # ─── Lint & Typecheck ───────────────────────────────────────────────────────
  test:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

  # ─── Build Android + iOS → Expo EAS ─────────────────────────────────────────
  build-mobile:
    name: Build Android + iOS → EAS
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Auto-increment version + versionCode + iOS buildNumber
        run: |
          # versionCode (Android build number): +1
          CURRENT=$(grep -o '"versionCode": *[0-9]*' app.json | grep -o '[0-9]*')
          NEW=$((CURRENT + 1))
          sed -i "s/\"versionCode\": *$CURRENT/\"versionCode\": $NEW/" app.json

          # buildNumber (iOS build number): string "N", mantida em paridade com o versionCode
          IOS_CURRENT=$(grep -o '"buildNumber": *"[0-9]*"' app.json | grep -o '[0-9]*')
          sed -i "s/\"buildNumber\": *\"$IOS_CURRENT\"/\"buildNumber\": \"$NEW\"/" app.json

          # versionName (semver exibido): bump do patch — major/minor continuam manuais
          VER=$(grep -o '"version": *"[0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*"' app.json | grep -o '[0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*')
          IFS=. read -r MA MI PA <<< "$VER"
          NEWVER="$MA.$MI.$((PA + 1))"
          sed -i "s/\"version\": *\"$VER\"/\"version\": \"$NEWVER\"/" app.json

          echo "version: $VER → $NEWVER | versionCode/buildNumber: $CURRENT → $NEW"
          echo "VERSION_CODE=$NEW" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$NEWVER" >> "$GITHUB_ENV"

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app.json
          git commit -m "chore: bump version to ${{ env.VERSION_NAME }} (build ${{ env.VERSION_CODE }}) [skip ci]"
          git push

      - name: Setup Expo e EAS CLI
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build Android (EAS)
        run: eas build --platform android --profile production --non-interactive

      # eas.json submit.production.android.serviceAccountKeyPath points at this
      # file; it is gitignored, so materialize it from the secret before submit.
      - name: Write Google Play service account key
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_KEY }}
        run: printf '%s' "$GOOGLE_PLAY_SERVICE_ACCOUNT_KEY" > google-sa-key.json

      - name: Submit to Play Store (internal track)
        run: eas submit --platform android --profile production --latest --non-interactive

      - name: Build iOS (EAS)
        run: eas build --platform ios --profile production --non-interactive

      # eas.json submit.production.ios.ascApiKeyPath points at this file; it is
      # gitignored (*.p8), so materialize it from the secret before submit.
      - name: Write App Store Connect API key
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: printf '%s' "$ASC_API_KEY_P8" > asc-api-key.p8

      - name: Submit to App Store Connect
        run: eas submit --platform ios --profile production --latest --non-interactive

      # OTA: publica o bundle JS no canal 'production'. Alcança apps já instalados
      # que compartilham o mesmo runtimeVersion (fingerprint nativo). Mudanças só
      # de JS chegam sem passar pela loja; mudanças nativas exigem novo build.
      - name: Publish OTA update (EAS Update)
        # --platform all: publica OTA para android e ios (ambos têm build nativo
        # neste pipeline). Web é servido pelo Firebase Hosting (job deploy-web),
        # não por OTA — `all` aqui = android + ios, não inclui web no export OTA.
        #
        # CRÍTICO: `eas update` roda `expo export` internamente, que NÃO lê o
        # bloco `env` de eas.json (esse só vale para `eas build`). Sem estas
        # vars aqui, o bundle OTA sai com EXPO_PUBLIC_FIREBASE_API_KEY=undefined
        # e o app quebra no boot ("Bundle Load Error"). Valores idênticos a
        # eas.json → build.production.env para o OTA casar com o build nativo
        # (config pública do Firebase Web, não são segredos).
        env:
          EXPO_PUBLIC_FIREBASE_API_KEY: AIzaSyDGQG2D1GNFANFjaTHU8_y3TBbRYzBeFgU
          EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: spartacus-artes-marciais.firebaseapp.com
          EXPO_PUBLIC_FIREBASE_PROJECT_ID: spartacus-artes-marciais
          EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: spartacus-artes-marciais.appspot.com
          EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "820921472402"
          EXPO_PUBLIC_FIREBASE_APP_ID: "1:820921472402:web:43848ccaf9d112def65d4b"
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: 820921472402-lnnfintlbq4k4imhrt63rpplf2lp6ven.apps.googleusercontent.com
          EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID: 820921472402-v9s5hgia6vhkjggrtsildr7tk7p91cm7.apps.googleusercontent.com
          EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: REPLACE_WITH_IOS_OAUTH_CLIENT_ID.apps.googleusercontent.com
          EXPO_PUBLIC_API_URL: https://api.spartacus.app.br
          EXPO_PUBLIC_EAS_PROJECT_ID: 9c2a3ad1-2083-45e1-bb03-3d127b554099
          EXPO_PUBLIC_USE_EMULATORS: "false"
        run: eas update --branch production --platform all --message "v${{ env.VERSION_NAME }} (build ${{ env.VERSION_CODE }})" --non-interactive

  # ─── Build Web PWA → Firebase Hosting ──────────────────────────────────────
  deploy-web:
    name: Deploy PWA → Firebase Hosting
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Build PWA (Expo Web)
        run: npx expo export --platform web
        env:
          EXPO_PUBLIC_API_URL: ${{ secrets.API_URL }}
          EXPO_PUBLIC_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          EXPO_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          EXPO_PUBLIC_FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          EXPO_PUBLIC_EAS_PROJECT_ID: ${{ secrets.EAS_PROJECT_ID }}

      - name: Authenticate to GCP via WIF
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Deploy to Firebase Hosting
        run: |
          npm install -g firebase-tools
          firebase deploy --only hosting:app \
            --project ${{ secrets.FIREBASE_PROJECT_ID }} \
            --non-interactive
