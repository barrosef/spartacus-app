name: CI/CD — App Mobile

on:
  push:
    branches: [main]
  pull_request:
    branches: [dev, main]

jobs:
  # ─── Lint & Typecheck ───────────────────────────────────────────────────────
  test:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

  # ─── Build Android → Expo EAS ───────────────────────────────────────────────
  build-mobile:
    name: Build Android → EAS
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Setup Expo e EAS CLI
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build Android (EAS)
        run: eas build --platform android --profile production --non-interactive

      - name: Submit to Play Store (internal track)
        run: eas submit --platform android --profile production --latest --non-interactive
